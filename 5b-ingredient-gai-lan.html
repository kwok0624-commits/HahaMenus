<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>芥蘭</title><style>body{margin:0;font-family:system-ui,-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;background:#f7efe4;color:#2b2b2b}.wrap{max-width:900px;margin:0 auto;padding:24px 16px 56px}.back{display:inline-block;margin-bottom:16px;color:#8a5a2b;text-decoration:none}.card{background:#fff;border:1px solid #e3d7c8;border-radius:22px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.05)}h1{margin:0 0 10px;font-size:34px}p{margin:0;color:#635b52;line-height:1.7}h2{margin:18px 0 10px;font-size:26px}ul{margin:0;padding-left:24px;line-height:1.8}</style></head><body><div class="wrap"><a class="back" href="5-recipe-satay-beef-gai-lan-v3.html">← 返回食譜頁</a><div class="card"><h1>芥蘭</h1><p>芥蘭是港式小炒常用蔬菜，莖部爽脆、葉片清甜，焯水後更易保持翠綠。</p><h2>營養價值</h2><p>芥蘭含膳食纖維、維生素 C、葉酸與鈣質。</p><h2>食療 / 常見作用</h2><p>芥蘭適合焯水後快炒，能保留口感與色澤。</p></div></div></body></html>
