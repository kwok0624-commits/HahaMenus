<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>雲耳</title><style>body{margin:0;font-family:system-ui,-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;background:#f7efe4;color:#2b2b2b}.wrap{max-width:900px;margin:0 auto;padding:24px 16px 56px}.back{display:inline-block;margin-bottom:16px;color:#8a5a2b;text-decoration:none}.card{background:#fff;border:1px solid #e3d7c8;border-radius:22px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.05)}h1{margin:0 0 10px;font-size:34px}p{margin:0;color:#635b52;line-height:1.7}h2{margin:18px 0 10px;font-size:26px}ul{margin:0;padding-left:24px;line-height:1.8}</style></head><body><div class="wrap"><a class="back" href="4-recipe-stir-fried-asparagus-black-fungus.html">← 返回食譜頁</a><div class="card"><h1>雲耳</h1><p>雲耳又稱木耳，口感爽脆，常見於小炒及涼拌菜式，屬低熱量配菜食材。</p><h2>營養資料</h2><p>雲耳熱量較低，含膳食纖維、鐵質及多種植物性營養成分；浸發後體積增加，適合入饌增加口感。</p><h2>食療功效</h2><p>家常上常用作清腸胃、配合均衡飲食的食材；與蔬菜同炒時可令菜式更有層次與飽足感。</p></div></div></body></html>
