<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>露筍</title><style>body{margin:0;font-family:system-ui,-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;background:#f7efe4;color:#2b2b2b}.wrap{max-width:900px;margin:0 auto;padding:24px 16px 56px}.back{display:inline-block;margin-bottom:16px;color:#8a5a2b;text-decoration:none}.card{background:#fff;border:1px solid #e3d7c8;border-radius:22px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.05)}h1{margin:0 0 10px;font-size:34px}p{margin:0;color:#635b52;line-height:1.7}h2{margin:18px 0 10px;font-size:26px}ul{margin:0;padding-left:24px;line-height:1.8}</style></head><body><div class="wrap"><a class="back" href="4-recipe-stir-fried-asparagus-black-fungus.html">← 返回食譜頁</a><div class="card"><h1>露筍</h1><p>露筍即蘆筍，屬低熱量蔬菜，口感爽嫩，常用於快炒、烚熟或焗製，味道清新。</p><h2>營養資料</h2><p>每100g約含熱量 20 kcal，並含維生素 K、葉酸、鉀及膳食纖維。</p><h2>食療功效</h2><p>家常上常被視作清爽高纖蔬菜，有助均衡飲食；配搭清淡烹調方式時，適合輕盈餐單。</p></div></div></body></html>
